<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Doc Scan</title>
<style>
  :root { --bg:#0e0e0e; --fg:#f2efe9; --dim:#9a958c; --accent:#e8c26a; --panel:rgba(20,20,20,.82); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }

  header { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background:var(--panel); z-index:3; }
  header h1 { font-size:16px; font-weight:600; letter-spacing:.02em; flex:1; }
  .seg { display:flex; border:1px solid #444; border-radius:999px; overflow:hidden; }
  .seg button { background:none; border:0; color:var(--dim); padding:6px 12px; font:inherit; font-size:13px; }
  .seg button.on { background:var(--accent); color:#111; }

  .stage { position:relative; flex:1; overflow:hidden; background:#000; }
  video, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  video { object-fit:contain; }
  #hint { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:var(--panel);
    padding:6px 12px; border-radius:999px; font-size:13px; color:var(--dim); white-space:nowrap; }
  #hint.found { color:var(--accent); }

  .bar { display:flex; align-items:center; justify-content:space-around; gap:12px;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 14px); background:var(--panel); z-index:3; }
  .btn { background:#262626; color:var(--fg); border:0; border-radius:12px; padding:12px 14px; font:inherit; min-width:72px; }
  .btn.primary { background:var(--accent); color:#111; font-weight:600; }
  .shutter { width:72px; height:72px; border-radius:50%; border:4px solid var(--fg); background:transparent; padding:0; }
  .shutter span { display:block; width:56px; height:56px; margin:4px; border-radius:50%; background:var(--fg); transition:transform .1s; }
  .shutter:active span { transform:scale(.88); }
  .stats { font-size:12px; color:var(--dim); text-align:center; padding:6px 16px 0; background:var(--panel); }

  #editorHost { position:relative; flex:1; overflow:hidden; background:#000; touch-action:none; }
  #resultWrap { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:16px; background:#1a1a1a; }
  #resultWrap canvas { max-width:100%; max-height:100%; box-shadow:0 6px 30px rgba(0,0,0,.6); background:#fff; }
  .msg { padding:24px; text-align:center; color:var(--dim); }
  .msg b { color:var(--fg); }
  input[type=file] { display:none; }

  /* OCR */
  #textWrap { flex:1; overflow:auto; background:#1a1a1a; position:relative; }
  #textWrap textarea { width:100%; min-height:100%; border:0; resize:none; background:#151515; color:var(--fg);
    padding:16px; font:14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; outline:none; }
  #textWrap .boxes { display:flex; justify-content:center; padding:16px; }
  #textWrap .boxes canvas { max-width:100%; height:auto; box-shadow:0 6px 30px rgba(0,0,0,.6); }
  .legend { display:flex; gap:12px; justify-content:center; font-size:12px; color:var(--dim); padding:6px 16px 0; background:var(--panel); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  select.lang { background:#262626; color:var(--fg); border:1px solid #444; border-radius:999px; padding:5px 10px; font:inherit; font-size:13px; }
  .progress { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(14,14,14,.86); color:var(--dim); font-size:14px; text-align:center; padding:24px; z-index:4; }
  .progress .track { width:70%; max-width:280px; height:6px; border-radius:3px; background:#333; overflow:hidden; }
  .progress .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }
</style>
</head>
<body>

<!-- 1. Live camera -->
<section id="camScreen" class="screen on">
  <header>
    <h1>Doc Scan</h1>
    <div class="seg" id="detSeg">
      <button data-det="classical" class="on">Edges</button>
      <button data-det="ml">ML</button>
    </div>
  </header>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="hint">Starting camera…</div>
    <div id="camMsg" class="msg" style="display:none;position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px"></div>
  </div>
  <div class="stats" id="liveStats">&nbsp;</div>
  <div class="bar">
    <label class="btn" for="filePick">Photo…</label>
    <button class="shutter" id="shutter" aria-label="Capture"><span></span></button>
    <button class="btn" id="liveToggle">Live: on</button>
  </div>
  <input type="file" id="filePick" accept="image/*" capture="environment">
</section>

<!-- 2. Adjust corners -->
<section id="editScreen" class="screen">
  <header><h1>Adjust corners</h1><span id="editStats" style="font-size:12px;color:var(--dim)"></span></header>
  <div id="editorHost"></div>
</section>

<!-- 3. Result -->
<section id="resultScreen" class="screen">
  <header>
    <h1>Result</h1>
    <div class="seg" id="lookSeg">
      <button data-look="color" class="on">Color</button>
      <button data-look="doc">Doc</button>
    </div>
  </header>
  <div id="resultWrap"></div>
  <div class="stats" id="resultStats">&nbsp;</div>
  <div class="bar">
    <button class="btn" id="retake">Retake</button>
    <button class="btn" id="readjust">Corners</button>
    <button class="btn" id="share">Share</button>
    <button class="btn primary" id="readText">Read text</button>
  </div>
</section>

<!-- 4. Text (OCR, on device) -->
<section id="textScreen" class="screen">
  <header>
    <h1>Text</h1>
    <div class="seg" id="viewSeg">
      <button data-view="boxes" class="on">Boxes</button>
      <button data-view="text">Text</button>
      <button data-view="md">MD</button>
    </div>
  </header>
  <div id="textWrap"></div>
  <div class="legend" id="legend">
    <span><i style="background:#6cc070"></i>sure ≥80</span>
    <span><i style="background:#e8c26a"></i>60–80</span>
    <span><i style="background:#e0605a"></i>unsure &lt;60</span>
  </div>
  <div class="stats" id="textStats">&nbsp;</div>
  <div class="bar">
    <button class="btn" id="textBack">Back</button>
    <select class="lang" id="lang" aria-label="Language">
      <option value="eng+fra" selected>EN+FR</option>
      <option value="eng">EN</option>
      <option value="fra">FR</option>
      <option value="deu">DE</option>
      <option value="eng+fra+deu">EN+FR+DE</option>
    </select>
    <button class="btn primary" id="textShare">Copy</button>
  </div>
</section>

<script type="module">
import { Scanner, createCornerEditor, extractDocument }
  from 'https://cdn.jsdelivr.net/npm/scanic@1.7.1/dist/scanic.js';
import Tesseract from 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.esm.min.js';

const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const scanner = new Scanner();
const KEYS = ['topLeft', 'topRight', 'bottomRight', 'bottomLeft'];

let detector = 'classical';
let live = true, busy = false, stream = null;
let shown = null, misses = 0;            // smoothed corners drawn on the live view
let capture = null, captureCorners = null; // full-resolution still + its corners
let extracted = null, look = 'color', editor = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}
function opts(extra) {
  return detector === 'ml' ? { detector: 'ml', ...extra } : { ...extra };
}
function ms(t0) { return Math.round(performance.now() - t0); }

/* ---------- detector toggle ---------- */
$('detSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  detector = b.dataset.det;
  [...$('detSeg').children].forEach(x => x.classList.toggle('on', x === b));
  shown = null;
  if (detector === 'ml') $('hint').textContent = 'Loading ML model (~2 MB, first time only)…';
});

/* ---------- camera ---------- */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) return cameraFailed('This browser gives no camera access here.');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
    $('hint').textContent = 'Point at a document';
    loop();
  } catch (err) {
    cameraFailed(err.name === 'NotAllowedError' ? 'Camera permission was refused.' : err.message);
  }
}
function cameraFailed(why) {
  const m = $('camMsg');
  m.style.display = 'flex';
  m.innerHTML = `<b>No live camera</b><span>${why}</span><span>Use <b>Photo…</b> to take or pick a picture instead.</span>`;
  $('hint').style.display = 'none';
}

/* ---------- live detection ---------- */
function fitBox() {
  // where the video is drawn inside its element (object-fit: contain)
  const w = overlay.clientWidth, h = overlay.clientHeight;
  const s = Math.min(w / video.videoWidth, h / video.videoHeight);
  return { s, x: (w - video.videoWidth * s) / 2, y: (h - video.videoHeight * s) / 2 };
}
function draw() {
  const dpr = devicePixelRatio || 1;
  const w = overlay.clientWidth, h = overlay.clientHeight;
  if (overlay.width !== w * dpr) { overlay.width = w * dpr; overlay.height = h * dpr; }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, w, h);
  if (!shown || !video.videoWidth) return;
  const { s, x, y } = fitBox();
  const p = KEYS.map(k => [x + shown[k].x * s, y + shown[k].y * s]);
  octx.beginPath();
  p.forEach(([px, py], i) => i ? octx.lineTo(px, py) : octx.moveTo(px, py));
  octx.closePath();
  octx.fillStyle = 'rgba(232,194,106,.18)'; octx.fill();
  octx.lineWidth = 3; octx.strokeStyle = '#e8c26a'; octx.stroke();
  octx.fillStyle = '#e8c26a';
  p.forEach(([px, py]) => { octx.beginPath(); octx.arc(px, py, 6, 0, 7); octx.fill(); });
}
function smooth(c) {
  if (!shown) return structuredClone(c);
  const a = 0.45; const out = {};
  for (const k of KEYS) out[k] = { x: shown[k].x + (c[k].x - shown[k].x) * a, y: shown[k].y + (c[k].y - shown[k].y) * a };
  return out;
}
async function loop() {
  requestAnimationFrame(loop);
  draw();
  if (!live || busy || !video.videoWidth || !$('camScreen').classList.contains('on')) return;
  busy = true;
  const t0 = performance.now();
  try {
    const r = await scanner.scan(video, opts({ mode: 'detect', maxProcessingDimension: 480 }));
    const t = ms(t0);
    if (r.success && r.corners) {
      shown = smooth(r.corners); misses = 0;
      $('hint').textContent = 'Document found — tap to capture'; $('hint').classList.add('found');
    } else if (++misses > 3) {
      shown = null; $('hint').textContent = 'Point at a document'; $('hint').classList.remove('found');
    }
    const extra = r.score != null ? ` · score ${r.score.toFixed(2)}` : r.confidence != null ? ` · conf ${(+r.confidence).toFixed(2)}` : '';
    $('liveStats').textContent = `${detector === 'ml' ? 'ML' : 'Edges'} · ${t} ms/frame · ${video.videoWidth}×${video.videoHeight}${extra}`;
  } catch (err) {
    $('liveStats').textContent = 'Detection error: ' + err.message;
  } finally {
    setTimeout(() => (busy = false), 60);
  }
}
$('liveToggle').onclick = () => {
  live = !live; $('liveToggle').textContent = 'Live: ' + (live ? 'on' : 'off');
  if (!live) { shown = null; $('hint').textContent = 'Live detection off'; $('hint').classList.remove('found'); }
};

/* ---------- capture ---------- */
async function grabStill() {
  // full sensor photo when the browser offers it, else the current video frame
  if ('ImageCapture' in window && stream) {
    try {
      const blob = await new ImageCapture(stream.getVideoTracks()[0]).takePhoto();
      return await toCanvas(await createImageBitmap(blob));
    } catch (_) { /* fall back to the frame */ }
  }
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return c;
}
async function toCanvas(src) {
  const max = 3000; // keep memory sane on big phone photos
  const s = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
$('shutter').onclick = async () => {
  if (!video.videoWidth) return $('filePick').click();
  $('hint').textContent = 'Capturing…';
  await useStill(await grabStill());
};
$('filePick').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  await useStill(await toCanvas(await createImageBitmap(f, { imageOrientation: 'from-image' })));
  e.target.value = '';
};
async function useStill(canvas) {
  capture = canvas;
  const t0 = performance.now();
  let r = null;
  try { r = await scanner.scan(capture, opts({ mode: 'detect', maxProcessingDimension: 1000 })); } catch (_) {}
  const t = ms(t0);
  captureCorners = r?.success ? r.corners : null;
  $('editStats').textContent = (captureCorners ? `found in ${t} ms` : 'not found — drag the corners') + ` · ${capture.width}×${capture.height}`;
  openEditor();
}

/* ---------- corner editor ---------- */
function openEditor() {
  show('editScreen');
  editor?.destroy();
  $('editorHost').innerHTML = '';
  requestAnimationFrame(() => {
    editor = createCornerEditor({
      container: $('editorHost'),
      image: capture,
      corners: captureCorners || undefined,
      magnifier: { zoom: 2.5, size: 120 },
      theme: { accent: '#e8c26a', surface: 'rgba(20,20,20,.9)', surfaceColor: '#f2efe9' },
      toolbar: { labels: { apply: 'Crop', cancel: 'Back' } },
      onConfirm: async corners => { captureCorners = corners; await makeResult(); },
      onCancel: () => { editor?.destroy(); editor = null; show('camScreen'); }
    });
  });
}

/* ---------- result ---------- */
async function makeResult() {
  const t0 = performance.now();
  const r = await extractDocument(capture, captureCorners, { output: 'canvas' });
  const t = ms(t0);
  editor?.destroy(); editor = null;
  if (!r.success || !r.output) { alert('Could not extract: ' + r.message); return show('camScreen'); }
  extracted = r.output;
  makeResult.n = (makeResult.n || 0) + 1; // new page → OCR runs again
  warmUp();                               // fetch the OCR engine while you look at the page
  $('resultStats').textContent = `straightened in ${t} ms · ${extracted.width}×${extracted.height}`;
  render();
  show('resultScreen');
}
function docLook(src) {
  // grey, whiter paper, darker ink: a simple per-image levels stretch
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const img = x.getImageData(0, 0, c.width, c.height), d = img.data;
  const hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) hist[(d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8]++;
  const n = d.length / 4; let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * 0.02) lo++;
  acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.25) hi--;
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    let g = (((d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8) - lo) / span;
    g = Math.min(1, Math.max(0, g)); g = Math.pow(g, 1.6) * 255; // push mid-greys toward ink
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function current() { return look === 'doc' ? docLook(extracted) : extracted; }
function render() { $('resultWrap').replaceChildren(current()); }
$('lookSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  look = b.dataset.look;
  [...$('lookSeg').children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('retake').onclick = () => show('camScreen');
$('readjust').onclick = () => openEditor();
$('share').onclick = async () => {
  const blob = await new Promise(r => current().toBlob(r, 'image/jpeg', 0.9));
  const name = 'scan-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.jpg';
  const file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (_) { return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* ---------- OCR: Tesseract.js, all on the phone ---------- */
// The WASM engine and language files come from the jsDelivr CDN the first time,
// then the language files are cached in IndexedDB. The image never leaves the phone.
let ocrWorker = null, ocrLang = null, ocrReady = null;
let ocrStatus = '', ocrProgress = 0;
let ocr = null;            // { key, canvas, data, text, md, ms }
let view = 'boxes';

const STATUS = {
  'loading tesseract core': 'Loading the OCR engine…',
  'initializing tesseract': 'Starting the OCR engine…',
  'loading language traineddata': 'Loading language data (first time: a few MB)…',
  'loaded language traineddata': 'Language data ready',
  'initializing api': 'Preparing…',
  'initialized api': 'Ready',
  'recognizing text': 'Reading the page…'
};
function onLog(m) {
  ocrStatus = STATUS[m.status] || m.status;
  ocrProgress = m.progress || 0;
  const p = $('textWrap').querySelector('.progress');
  if (p) {
    p.querySelector('.label').textContent = ocrStatus;
    p.querySelector('.fill').style.width = Math.round(ocrProgress * 100) + '%';
  }
}
function getWorker(lang) {
  if (ocrReady && ocrLang === lang) return ocrReady;
  ocrLang = lang;
  ocrReady = (async () => {
    if (!ocrWorker) {
      // OEM 1 = LSTM only (the "best_int" models: smaller, more accurate)
      ocrWorker = await Tesseract.createWorker(lang, 1, { logger: onLog });
    } else {
      await ocrWorker.reinitialize(lang, 1);
    }
    await ocrWorker.setParameters({ user_defined_dpi: '300', preserve_interword_spaces: '1' });
    return ocrWorker;
  })();
  ocrReady.catch(() => { ocrReady = null; });
  return ocrReady;
}
function warmUp() { getWorker($('lang').value).catch(() => {}); }

function forOcr(src) {
  // Tesseract likes text around 20–40 px tall: bring the page to ~1600–2400 px wide
  const w = src.width;
  const s = w < 1600 ? Math.min(2, 1600 / w) : w > 2400 ? 2400 / w : 1;
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function lineH(l) {
  const r = l.rowAttributes?.rowHeight;
  return r > 0 ? r : l.bbox.y1 - l.bbox.y0;
}
function joinLines(lines) {
  let out = '';
  for (const raw of lines) {
    const t = raw.trim();
    if (!t) continue;
    if (!out) out = t;
    else if (/[A-Za-zÀ-ÿ]-$/.test(out) && /^[a-zà-ÿ]/.test(t)) out = out.slice(0, -1) + t; // hyphenated word
    else out += ' ' + t;
  }
  return out;
}
const BULLET = /^([•·▪◦●○■□➢►\-–—*]|\d{1,3}[.)]|[a-z][.)])\s+/;
function toMarkdown(blocks) {
  const all = [];
  blocks.forEach(b => b.paragraphs.forEach(p => p.lines.forEach(l => { if (l.text.trim()) all.push(lineH(l)); })));
  if (!all.length) return '';
  all.sort((a, b) => a - b);
  const median = all[Math.floor(all.length / 2)];
  const parts = [];
  for (const b of blocks) for (const p of b.paragraphs) {
    const lines = p.lines.filter(l => l.text.trim());
    if (!lines.length) continue;
    const texts = lines.map(l => l.text.trim());
    const avg = lines.reduce((s, l) => s + lineH(l), 0) / lines.length;
    const ratio = avg / median;
    const joined = joinLines(texts);

    if (lines.length <= 2 && ratio >= 1.3 && joined.length < 120) {
      const level = ratio >= 1.9 ? 1 : ratio >= 1.55 ? 2 : 3;
      parts.push('#'.repeat(level) + ' ' + joined.replace(/[:.]$/, ''));
      continue;
    }
    if (texts.some(t => BULLET.test(t))) {
      const items = [];
      for (const t of texts) {
        const m = t.match(BULLET);
        if (m) items.push({ num: /\d/.test(m[1]) ? m[1] : null, lines: [t.slice(m[0].length)] });
        else if (items.length) items[items.length - 1].lines.push(t);
        else items.push({ num: null, plain: true, lines: [t] });
      }
      parts.push(items.map(it => it.plain ? joinLines(it.lines)
        : (it.num ? it.num.replace(')', '.') + ' ' : '- ') + joinLines(it.lines)).join('\n'));
      continue;
    }
    parts.push(joined);
  }
  return parts.join('\n\n') + '\n';
}

function boxesCanvas() {
  const c = document.createElement('canvas');
  c.width = ocr.canvas.width; c.height = ocr.canvas.height;
  const x = c.getContext('2d');
  x.drawImage(ocr.canvas, 0, 0);
  x.lineWidth = Math.max(2, c.width / 600);
  for (const b of ocr.data.blocks || []) for (const p of b.paragraphs) for (const l of p.lines) for (const w of l.words) {
    if (!w.text.trim()) continue;
    const col = w.confidence >= 80 ? '108,192,112' : w.confidence >= 60 ? '232,194,106' : '224,96,90';
    const { x0, y0, x1, y1 } = w.bbox;
    x.fillStyle = `rgba(${col},.16)`; x.fillRect(x0, y0, x1 - x0, y1 - y0);
    x.strokeStyle = `rgb(${col})`; x.strokeRect(x0, y0, x1 - x0, y1 - y0);
  }
  return c;
}
function renderText() {
  const wrap = $('textWrap');
  $('legend').style.display = view === 'boxes' ? 'flex' : 'none';
  $('textShare').textContent = 'Copy';
  if (!ocr) return;
  if (view === 'boxes') {
    const d = document.createElement('div'); d.className = 'boxes'; d.append(boxesCanvas());
    wrap.replaceChildren(d);
  } else {
    const ta = document.createElement('textarea');
    ta.spellcheck = false;
    ta.value = view === 'md' ? ocr.md : ocr.text;
    ta.oninput = () => { ocr[view === 'md' ? 'md' : 'text'] = ta.value; }; // your corrections are kept
    wrap.replaceChildren(ta);
  }
}
function showProgress() {
  const p = document.createElement('div');
  p.className = 'progress';
  p.innerHTML = `<span class="label">${ocrStatus || 'Starting…'}</span><div class="track"><div class="fill"></div></div>
    <span style="font-size:12px">Runs on this phone · the image is not uploaded</span>`;
  $('textWrap').replaceChildren(p);
}

async function runOcr() {
  if (!extracted) return;
  const lang = $('lang').value;
  const key = [extracted.width, extracted.height, look, lang, makeResult.n].join('|');
  show('textScreen');
  if (ocr?.key === key) return renderText();
  ocr = null; ocrStatus = ''; showProgress();
  $('textStats').textContent = '';
  try {
    const t0 = performance.now();
    const worker = await getWorker(lang);
    const tLoad = ms(t0);
    const canvas = forOcr(current());
    const t1 = performance.now();
    const { data } = await worker.recognize(canvas, {}, { text: true, blocks: true });
    const t = ms(t1);
    const words = [];
    (data.blocks || []).forEach(b => b.paragraphs.forEach(p => p.lines.forEach(l => l.words.forEach(w => w.text.trim() && words.push(w)))));
    const unsure = words.filter(w => w.confidence < 60).length;
    ocr = { key, canvas, data, text: data.text.trim() + '\n', md: toMarkdown(data.blocks || []) };
    $('textStats').textContent =
      `${lang} · read in ${(t / 1000).toFixed(1)} s` + (tLoad > 300 ? ` (+${(tLoad / 1000).toFixed(1)} s loading)` : '') +
      ` · ${words.length} words · conf ${Math.round(data.confidence)} · ${unsure} unsure · ${canvas.width}×${canvas.height}`;
    if (!words.length) {
      $('textWrap').innerHTML = '<div class="msg"><b>No text found.</b><br>Try the Doc look, a closer photo, or another language.</div>';
      return;
    }
    renderText();
  } catch (err) {
    $('textWrap').innerHTML = `<div class="msg"><b>OCR failed</b><br>${err?.message || err}</div>`;
  }
}

$('readText').onclick = runOcr;
$('textBack').onclick = () => show('resultScreen');
$('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.view;
  [...$('viewSeg').children].forEach(x => x.classList.toggle('on', x === b));
  if (ocr) renderText();
});
$('lang').onchange = () => { if ($('textScreen').classList.contains('on')) runOcr(); else warmUp(); };
$('textShare').onclick = async () => {
  if (!ocr) return;
  const txt = view === 'text' ? ocr.text : ocr.md;
  try { await navigator.clipboard.writeText(txt); $('textShare').textContent = 'Copied'; }
  catch (_) {
    const name = 'scan-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.md';
    const file = new File([txt], name, { type: 'text/markdown' });
    if (navigator.canShare?.({ files: [file] })) navigator.share({ files: [file], title: name }).catch(() => {});
  }
  setTimeout(() => ($('textShare').textContent = 'Copy'), 1500);
};

startCamera();
</script>
