<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4efe4">
<title>metos</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --paper: #f4efe4;
    --card: #fbf8f1;
    --ink: #2b2620;
    --muted: #7a7064;
    --line: #ddd3c2;
    --accent: #5b6b3a;
    --warn-bg: #f6e3d3;
    --warn-ink: #7a2e0e;
    --code: #efe8da;
    --ok: #3f6b2a;
    --ok-bg: #e4ecd3;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1a17;
      --card: #24221e;
      --ink: #e9e3d6;
      --muted: #9a9183;
      --line: #3a362f;
      --accent: #a9bb7c;
      --warn-bg: #3a2418;
      --warn-ink: #f0b48f;
      --code: #2c2924;
      --ok: #b7d39a;
      --ok-bg: #26301c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--serif); font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  header { padding: 20px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--mono); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; letter-spacing: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 13px; }
  .tools label, .tools button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  .tools label:hover, .tools button:hover { color: var(--ink); border-color: var(--muted); }
  .tools input { display: none; }

  #log { padding: 8px 0 140px; }
  .q { font-family: var(--mono); font-size: 14px; color: var(--muted); margin: 24px 0 8px; }
  .q::before { content: "> "; color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .card h2 { font-size: 19px; margin: 0 0 2px; }
  .card .sec { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 8px 10px; margin: 10px 0; font-size: 15px; }
  .warn::before { content: "! "; font-family: var(--mono); font-weight: 700; }
  .note { color: var(--muted); font-style: italic; font-size: 15px; }
  .body p { margin: 10px 0; }
  .body ol, .body ul { margin: 10px 0; padding-left: 22px; }
  .body li { margin: 4px 0; }
  .body pre { background: var(--code); border-radius: 4px; padding: 10px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.35; }
  .body figure { margin: 12px 0; }
  .body img { max-width: 100%; border-radius: 4px; border: 1px solid var(--line); background: #fff; }
  .body figcaption { font-size: 14px; color: var(--muted); }

  /* text pictures: keep the pixels crisp, never blurred by scaling */
  figure.pic { margin: 12px 0; }
  figure.pic img, figure.pic canvas { display: block; width: 100%; max-width: 420px; height: auto; image-rendering: pixelated; border-radius: 4px; border: 1px solid var(--line); }

  .tool .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
  .tool label { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tool label.wide { grid-column: 1 / -1; }
  .tool select, .tool input {
    font: 15px var(--mono); color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0;
  }
  .tool .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .tool .views figure { margin: 0; min-width: 0; }
  .tool .views figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  /* raw view: one character per pixel, line height matched to character
     width so the picture keeps its proportions */
  .tool pre.raw {
    margin: 0; min-width: 0; overflow: hidden; font-family: var(--mono); line-height: 0.6; letter-spacing: 0;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px;
  }
  .copybox { width: 100%; height: 120px; margin-top: 10px; font: 11px var(--mono); }

  /* entry editor: a full-screen sheet over the conversation */
  html.sheet-open, html.sheet-open body { overflow: hidden; }
  .sheet {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--paper);
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-in { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sheet-bar {
    position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sheet-bar .sheet-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .sheet-bar h2 { font-family: var(--mono); font-size: 18px; font-weight: 600; margin: 0; }
  .sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 16px; }
  @media (min-width: 880px) {
    .sheet-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
    .ed-side { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
  }
  .ed-form, .ed-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .ed-group { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .ed-group legend { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 6px; }
  .ed-field { display: flex; flex-direction: column; gap: 3px; }
  .ed-label { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .ed-hint { font-size: 14px; color: var(--muted); line-height: 1.35; margin: 0; }
  .sheet input[type=text], .sheet textarea, .sheet select {
    font: 16px var(--serif); color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; min-width: 0;
  }
  .sheet textarea { resize: vertical; line-height: 1.45; }
  .sheet select { font-family: var(--mono); font-size: 14px; }
  .sheet input:focus, .sheet textarea:focus, .sheet select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .sheet input[readonly] { color: var(--muted); }
  .ed-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.small { font-size: 12px; padding: 2px 8px; }
  .ed-group > .chip { align-self: flex-start; }
  .ed-pick { max-width: 320px; }
  .ed-sections { display: flex; flex-direction: column; gap: 12px; }
  .ed-section { display: flex; flex-direction: column; gap: 6px; }
  .ed-sec-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ed-sec-top select { flex: 1 1 200px; width: auto; }
  .ed-sec-top input { flex: 1 1 140px; width: auto; }
  .ed-picture .body img { max-width: 220px; }
  .ghost { font: 13px var(--mono); background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  .ghost.small { padding: 3px 8px; font-size: 12px; }
  .primary { font: 15px var(--mono); background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  .ed-panel h3 { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .ed-panel .card .sec { margin-top: 12px; }
  .ed-result { margin-top: 8px; font-size: 15px; border-radius: 4px; padding: 0; }
  .ed-result.c-ok, .ed-result.c-warn, .ed-result.c-bad { padding: 8px 10px; }
  .ed-result.c-ok { background: var(--ok-bg); color: var(--ok); }
  .ed-result.c-warn { background: var(--code); color: var(--ink); }
  .ed-result.c-bad { background: var(--warn-bg); color: var(--warn-ink); }
  .ed-why { display: block; font: 12px var(--mono); opacity: 0.8; margin-top: 3px; }
  .ed-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
  .ed-checks li::before { font-family: var(--mono); margin-right: 6px; }
  .ed-checks li.c-ok { color: var(--ok); }
  .ed-checks li.c-ok::before { content: "✓"; }
  .ed-checks li.c-warn { color: var(--muted); }
  .ed-checks li.c-warn::before { content: "·"; }
  .ed-checks li.c-bad { color: var(--warn-ink); }
  .ed-checks li.c-bad::before { content: "!"; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ed-actions .chip { margin: 0; }
  .ed-status { font-size: 14px; color: var(--muted); margin: 0; min-height: 1em; }
  .ed-raw summary { cursor: pointer; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .ed-raw pre { background: var(--code); border-radius: 4px; padding: 10px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  .chip.edit { border-style: dotted; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); padding: 3px 9px; border-radius: 999px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.see { border-style: dashed; }
  .src { font-size: 13px; color: var(--muted); margin-top: 10px; }
  details { margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  details pre { white-space: pre-wrap; margin: 6px 0 0; }
  .list li { margin: 8px 0; }
  .list button { all: unset; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); }
  .list button:hover { color: var(--accent); }
  .list .first { display: block; color: var(--muted); font-size: 15px; }

  .intro { color: var(--muted); margin: 24px 0 8px; }

  form {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
    border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  }
  form .wrap { display: flex; gap: 8px; }
  #q {
    flex: 1; font: 16px var(--mono); padding: 10px 12px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  }
  #q:focus { outline: none; border-color: var(--accent); }
  form button { font: 15px var(--mono); padding: 0 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--paper); cursor: pointer; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>metos <small id="count"></small></h1>
      <div class="tools">
        <label title="Read a kb folder directly, with its images">open folder<input id="folder" type="file" webkitdirectory multiple></label>
        <label title="Add .md or .txt entries">add entries<input id="files" type="file" accept=".md,.txt,text/markdown,text/plain" multiple></label>
        <label title="Turn a photo into a picture any device can show">add picture<input id="photo" type="file" accept="image/*"></label>
        <button id="new-entry" type="button" title="Write a new entry by hand">new entry</button>
      </div>
    </header>
    <div id="log"></div>
  </div>

  <form id="ask" autocomplete="off">
    <div class="wrap">
      <input id="q" type="text" placeholder="Ask, e.g. how do I make water safe" aria-label="Question">
      <button type="submit">ask</button>
    </div>
  </form>

  <script src="engine.js"></script>
  <script src="pic.js"></script>
  <script src="kb.js"></script>
  <script src="app.js"></script>
  <script src="editor.js"></script>
  <script>document.getElementById('new-entry').addEventListener('click', function () { metosEditor.open(); });</script>
</body>
</html>
