<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="sans-serif" font-size="12">
  <title>Cone fire lay</title>
  <rect width="320" height="220" fill="#fbf8f1"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#6b5b45" stroke-width="2"/>
  <g stroke="#7a5a35" stroke-width="5" stroke-linecap="round">
    <line x1="110" y1="178" x2="160" y2="60"/>
    <line x1="210" y1="178" x2="160" y2="60"/>
    <line x1="130" y1="178" x2="162" y2="64"/>
    <line x1="190" y1="178" x2="158" y2="64"/>
    <line x1="150" y1="178" x2="160" y2="62"/>
  </g>
  <ellipse cx="160" cy="162" rx="22" ry="14" fill="#e3c26b" stroke="#b08a2e"/>
  <text x="160" y="166" text-anchor="middle" fill="#5b4310">tinder</text>
  <text x="232" y="110" fill="#3a3a3a">kindling</text>
  <line x1="228" y1="106" x2="196" y2="118" stroke="#3a3a3a"/>
  <path d="M30 150 h46" stroke="#4a6f8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="140" fill="#4a6f8a">wind</text>
  <text x="160" y="205" text-anchor="middle" fill="#3a3a3a">leave a gap on the wind side, light there</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a6f8a"/></marker></defs>
</svg>
